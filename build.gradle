plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "AlexIIL"
        url = "https://staging.alexiil.uk/maven/"
    }
    maven { url 'https://jitpack.io' }
}

loom {
    runs {
        client {
            client()
            setConfigName("Minecraft Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Minecraft Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // HTTP
    include(implementation("org.nanohttpd:nanohttpd:2.3.1"))
    include(implementation("org.nanohttpd:nanohttpd-websocket:2.3.1"))

    // GUI
    implementation(include("io.github.cottonmc:LibGui:${project.libgui_version}"))

    // HashiCraft
    //implementation(files("..\\fabric-stateful-mod\\build\\libs\\fabric-stateful-mod-1.5.2.jar"))
    implementation(include("com.github.hashicraft:fabric-stateful-mod:${stateful_version}"))

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
